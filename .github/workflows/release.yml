# pi-deu release — tag v* -> npm with provenance (OIDC Trusted Publishing).
# Setup once: npmjs.com/package/pi-deu > Settings > Trusted Publisher > GitHub Actions (org deuriib, repo pi-deu, workflow release.yml).
# Fallback (not recommended): add repo secret NPM_TOKEN (automation token, rotate) and uncomment the two TOKEN lines.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-pack
          path: "*.tgz"
